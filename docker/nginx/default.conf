server {
    listen 80;
    server_name localhost;
    root /var/www/backend/public;

    client_max_body_size 32M;

    # Alle Anfragen gehen an Symfonys Front-Controller (public/index.php)
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        internal;
    }

    # Andere .php-Dateien dürfen nicht direkt aufgerufen werden
    location ~ \.php$ {
        return 404;
    }

    # CORS übernimmt Symfony (NelmioCorsBundle), nicht Nginx

    gzip on;
    gzip_types application/json application/javascript text/css;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
