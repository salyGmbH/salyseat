
<!-- ===================== DARSTELLUNG ===================== -->
<div class="settings-block">

  <div class="section-header">
    <h2 class="section-title">{{ 'allgemein.display' | translate }}</h2>

    <div class="header-actions">
      <button class="info-button"
              [class.active]="themeInfo()"
              (click)="toggleThemeInfo()">
        <mat-icon>info</mat-icon>
      </button>
    </div>
  </div>

  <div class="info-box" [class.open]="themeInfo()">
    {{ 'allgemein.display_hint' | translate }}
  </div>

  <div class="view-toggle">
    <button [class.active]="theme() === 'light'" (click)="setTheme('light')">
      <mat-icon>light_mode</mat-icon> {{ 'allgemein.light' | translate }}
    </button>

    <button [class.active]="theme() === 'dim'" (click)="setTheme('dim')">
      <mat-icon>brightness_4</mat-icon> {{ 'allgemein.dim' | translate }}
    </button>

    <button [class.active]="theme() === 'dark'" (click)="setTheme('dark')">
      <mat-icon>dark_mode</mat-icon> {{ 'allgemein.dark' | translate }}
    </button>

    <button [class.active]="theme() === 'system'" (click)="setTheme('system')">
      <mat-icon>desktop_windows</mat-icon> {{ 'allgemein.system' | translate }}
    </button>
  </div>

  @if (theme() === 'system') {
    <div class="theme-effective">
      <mat-icon>info_outline</mat-icon>
      <span>
        {{ 'allgemein.system_follows' | translate }}
        <strong>{{ effective() === 'dark' ? ('allgemein.dark' | translate) + ' 🌙' : ('allgemein.light' | translate) + ' ☀️' }}</strong>
      </span>
    </div>
  }

  <div class="actions">
    <button class="save-button"
            [class.saved]="themeSaved()"
            (click)="saveTheme()">
      {{ themeSaved() ? ('common.saved' | translate) : ('common.save' | translate) }}
    </button>
  </div>

</div>
