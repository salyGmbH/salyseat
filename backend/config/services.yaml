# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    widget_base_url: '%env(WIDGET_BASE_URL)%'
    mailer_sender: '%env(MAILER_SENDER)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $mailerSender: '%mailer_sender%'
            string $widgetBaseUrl: '%widget_base_url%'
            string $uploadsDir: '%kernel.project_dir%/public/uploads'
            string $publicDir: '%kernel.project_dir%/public'

    # Alle Klassen in src/ werden automatisch als Services registriert.
    # Entities sind keine Services und werden deshalb ausgeschlossen.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Module/*/Domain/Entity/'
