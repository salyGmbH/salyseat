nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Public-Key']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        # Admin-API: nur von den lokalen Angular-Apps (siehe CORS_ALLOW_ORIGIN in .env)
        '^/api/v1/admin': ~
        '^/api/v1/auth': ~
        # Widget-API: wird auf fremden Webseiten eingebettet, daher jede Herkunft erlaubt
        '^/api/v1/widget':
            origin_regex: false
            allow_origin: ['*']
